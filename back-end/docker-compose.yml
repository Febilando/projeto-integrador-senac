services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-GerenciadorPedidos}
      MYSQL_USER: ${MYSQL_USER:-gerenciador}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no arquivo .env}
    ports:
      - "3306:3306"
    volumes:
      - dados_mysql:/var/lib/mysql
      - "./banco de dados/setup_banco.sql:/docker-entrypoint-initdb.d/001_setup.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-GerenciadorPedidos}
      MYSQL_USER: ${MYSQL_USER:-gerenciador}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no arquivo .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      LOW_STOCK_LIMIT: ${LOW_STOCK_LIMIT:-10}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?Defina AUTH_SESSION_SECRET no arquivo .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      SESSION_DURATION_SECONDS: ${SESSION_DURATION_SECONDS:-28800}
      REMEMBERED_SESSION_DURATION_SECONDS: ${REMEMBERED_SESSION_DURATION_SECONDS:-2592000}
    ports:
      - "8000:8000"

volumes:
  dados_mysql:
