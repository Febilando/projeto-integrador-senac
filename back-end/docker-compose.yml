services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-GerenciadorPedidos}
      MYSQL_USER: ${MYSQL_USER:-gerenciador}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no arquivo .env}
    ports:
      - "3306:3306"
    volumes:
      - dados_mysql:/var/lib/mysql
      - "./banco de dados/setup_banco.sql:/docker-entrypoint-initdb.d/001_setup.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-GerenciadorPedidos}
      DB_USER: ${MYSQL_USER:-gerenciador}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no arquivo .env}
    ports:
      - "8000:8000"

volumes:
  dados_mysql:
