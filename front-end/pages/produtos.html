<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <link rel="stylesheet" href="../styles/reset.css">
    <link rel="stylesheet" href="../styles/sidebar.css">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/produtos.css">
    <script src="header/header.js" defer></script>
    <script type="module" src="sidebar/sidebar.js"></script>
    <script type="module" src="../assets/js/auth-guard.js"></script>
    <script type="module" src="../assets/js/produtos.js"></script>
</head>
<body class="has-sidebar">
    <aside class="sidebar" id="app-sidebar" aria-label="Navegação do sistema"></aside>
    <header></header>

    <main class="products-main">
        <section class="products-heading">
            <div>
                <p class="products-eyebrow">Catálogo</p>
                <h1>Produtos</h1>
                <p class="products-description">Consulte e acompanhe os produtos cadastrados.</p>
            </div>
            <div class="products-heading-actions">
                <button class="products-primary-button" id="new-product" type="button">
                    Novo produto
                </button>
                <button class="products-refresh-button" id="refresh-products" type="button">
                    Atualizar lista
                </button>
            </div>
        </section>

        <section class="table-card">
            <div class="table-card-heading">
                <div>
                    <h2>Catálogo de produtos</h2>
                    <p>Produtos e níveis de estoque</p>
                </div>
                <span class="table-count" id="products-count" aria-live="polite">Carregando...</span>
            </div>

            <div class="table-toolbar">
                <div class="table-toolbar-actions">
                    <div class="table-sort-controls" role="group">
                        <span>Ordenar:</span>
                        <button type="button" data-sort="nome" data-label="Alfabética" aria-pressed="true">Alfabética ↑</button>
                        <button type="button" data-sort="estoque" data-label="Estoque" aria-pressed="false">Estoque ↑</button>
                    </div>
                    <div class="table-stock-filter">
                        <span>Estoque máximo</span>
                        <input
                            id="max-stock"
                            class="input-text"
                            type="number"
                            min="0"
                            placeholder="Máx."
                        >
                    </div>
                </div>
                <input
                    id="products-search"
                    class="input-text table-search"
                    type="search"
                    placeholder="Pesquisar produtos..."
                >
            </div>

            <p class="products-feedback" id="products-feedback" role="status" aria-live="polite">Conectando à API...</p>

            <div class="table-wrap">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th scope="col">Imagem</th>
                            <th scope="col">ID</th>
                            <th scope="col">Produto</th>
                            <th scope="col">Estoque</th>
                            <th scope="col">Disponibilidade</th>
                            <th scope="col">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="products-rows" aria-busy="true">
                        <tr><td class="table-message" colspan="6">Carregando produtos...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <dialog class="product-dialog" id="product-dialog" aria-labelledby="product-dialog-title">
        <form class="product-form" id="product-form">
            <div class="product-dialog-heading">
                <h2 id="product-dialog-title">Novo produto</h2>
                <button class="dialog-close-button" type="button" data-close-product-dialog aria-label="Fechar formulário">×</button>
            </div>
            <p class="product-form-feedback" id="product-form-feedback" role="alert" aria-live="polite"></p>

            <label for="product-name">Nome</label>
            <input class="input-text" id="product-name" name="nome" type="text" required>

            <label for="product-stock">Estoque inicial</label>
            <input class="input-text" id="product-stock" name="estoque" type="number" min="0" step="1" required>

            <label for="product-image">Imagem (URL ou caminho, opcional)</label>
            <input class="input-text" id="product-image" name="img" type="text">

            <div class="product-form-actions">
                <button class="product-secondary-button" type="button" data-close-product-dialog>Cancelar</button>
                <button class="products-primary-button" id="save-product" type="submit">Salvar produto</button>
            </div>
        </form>
    </dialog>

    <dialog class="product-dialog" id="restock-dialog" aria-labelledby="restock-dialog-title">
        <form class="product-form" id="restock-form">
            <div class="product-dialog-heading">
                <h2 id="restock-dialog-title">Repor estoque</h2>
                <button class="dialog-close-button" type="button" data-close-restock-dialog aria-label="Fechar formulário">×</button>
            </div>
            <p class="product-form-feedback" id="restock-form-feedback" role="alert" aria-live="polite"></p>

            <label for="restock-quantity">Quantidade a adicionar</label>
            <input class="input-text" id="restock-quantity" name="quantidade" type="number" min="1" step="1" required>

            <div class="product-form-actions">
                <button class="product-secondary-button" type="button" data-close-restock-dialog>Cancelar</button>
                <button class="products-primary-button" id="save-restock" type="submit">Confirmar reposição</button>
            </div>
        </form>
    </dialog>
</body>
</html>
