services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ./back-end/.env
    ports:
      - "3306:3306"
    volumes:
      - dados_mysql:/var/lib/mysql
      - "./back-end/banco de dados/setup_banco.sql:/docker-entrypoint-initdb.d/001_setup.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    environment:
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
