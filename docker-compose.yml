name: back-end

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ./back-end/.env
    ports:
      - "3306:3306"
    volumes:
      - dados_mysql:/var/lib/mysql
      - "./back-end/banco de dados/setup_banco.sql:/docker-entrypoint-initdb.d/001_setup.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./back-end
    restart: unless-stopped
    env_file:
      - ./back-end/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      CORS_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
      CORS_ALLOW_CREDENTIALS: "true"
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./front-end
    restart: unless-stopped
    ports:
      - "5500:80"

volumes:
  dados_mysql:
