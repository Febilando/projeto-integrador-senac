name: back-end

services:
  api:
    build:
      context: ./back-end
    restart: unless-stopped
    env_file:
      - ./back-end/.env
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      CORS_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
      CORS_ALLOW_CREDENTIALS: "true"
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./front-end
    restart: unless-stopped
    ports:
      - "5500:80"

volumes:
  dados_mysql:
